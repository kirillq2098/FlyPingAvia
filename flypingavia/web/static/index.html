<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>FlyPingAvia</title>
  <script src="/assets/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">FlyPingAvia</div>
      <p class="tagline">Следите за ценой. Покупайте вовремя.</p>
      <p id="boot" class="boot">Загрузка…</p>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="search" type="button">Поиск</button>
      <button class="tab" data-tab="watches" type="button">Подписки</button>
    </nav>

    <section id="panel-search" class="panel active">
      <form id="search-form" class="stack">
        <label class="field">
          <span>Откуда</span>
          <input id="origin" name="origin" placeholder="Москва / MOW" autocomplete="off" required />
          <div id="origin-hint" class="hint"></div>
        </label>
        <label class="field">
          <span>Куда</span>
          <input id="destination" name="destination" placeholder="Анталья / AYT" autocomplete="off" required />
          <div id="destination-hint" class="hint"></div>
        </label>
        <label class="field">
          <span>Дата вылета (необязательно)</span>
          <input id="depart" name="depart" type="date" />
        </label>

        <div class="trip-toggle" role="group" aria-label="Тип билета">
          <button type="button" class="trip-btn active" data-trip="oneway">В одну сторону</button>
          <button type="button" class="trip-btn" data-trip="round">Туда и обратно</button>
        </div>

        <label class="field hidden" id="return-field">
          <span>Дата возврата</span>
          <input id="return" name="return" type="date" />
        </label>

        <div class="pax-block">
          <div class="pax-title">Пассажиры</div>
          <div class="pax-row">
            <span>Взрослые</span>
            <div class="stepper">
              <button type="button" data-pax="adults" data-delta="-1">−</button>
              <strong id="adults-val">1</strong>
              <button type="button" data-pax="adults" data-delta="1">+</button>
            </div>
          </div>
          <div class="pax-row">
            <span>Дети 2–12</span>
            <div class="stepper">
              <button type="button" data-pax="children" data-delta="-1">−</button>
              <strong id="children-val">0</strong>
              <button type="button" data-pax="children" data-delta="1">+</button>
            </div>
          </div>
          <div class="pax-row">
            <span>Младенцы 0–2</span>
            <div class="stepper">
              <button type="button" data-pax="infants" data-delta="-1">−</button>
              <strong id="infants-val">0</strong>
              <button type="button" data-pax="infants" data-delta="1">+</button>
            </div>
          </div>
          <p class="meta pax-hint">Порог и цена — за всех. Младенцы ≈ 10% тарифа.</p>
        </div>

        <button class="btn primary" type="submit" id="search-btn">Показать вилку цен</button>
      </form>

      <div id="quote" class="quote hidden"></div>

      <form id="watch-form" class="stack watch-form hidden">
        <label class="field">
          <span>Порог слежения, ₽</span>
          <input id="threshold" name="threshold" type="number" min="1" step="1" inputmode="numeric" required />
        </label>
        <div class="btn-row">
          <button type="button" class="btn ghost" data-preset="cheap">Дёшево</button>
          <button type="button" class="btn ghost" data-preset="typical">Обычно</button>
        </div>
        <button class="btn primary" type="submit">Следить за ценой</button>
      </form>
    </section>

    <section id="panel-watches" class="panel">
      <div id="watches" class="watches"></div>
      <button class="btn ghost full" type="button" id="refresh-watches">Обновить</button>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
