[project]
name = "flypingavia"
version = "0.3.0"
description = "Telegram-бот для мониторинга цен на авиабилеты"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.15,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
flypingavia = "flypingavia.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["flypingavia*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
