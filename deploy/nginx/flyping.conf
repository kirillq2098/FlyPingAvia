# FlyPing production Nginx — Timeweb VPS (IN-04)
# Domains: flyping.ru, app.flyping.ru, api.flyping.ru
# Upstream: bot+MiniApp+API on 127.0.0.1:8080; marketing Next.js on 127.0.0.1:3000

upstream flyping_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream flyping_site {
    server 127.0.0.1:3000;
    keepalive 8;
}

# --- HTTP: ACME + redirect ---

server {
    listen 80;
    listen [::]:80;
    server_name flyping.ru www.flyping.ru app.flyping.ru api.flyping.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Marketing site: flyping.ru (Next.js production) ---

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flyping.ru www.flyping.ru;

    ssl_certificate     /etc/letsencrypt/live/flyping.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flyping.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location ~ /\.(git|env|ht) {
        deny all;
        return 404;
    }

    # Hashed Next assets — long cache
    location ^~ /_next/static/ {
        proxy_pass http://flyping_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /images/ {
        proxy_pass http://flyping_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=604800" always;
    }

    location = /favicon.svg {
        proxy_pass http://flyping_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # HTML / SSR routes — no-cache at edge for fresh deploys
    location / {
        proxy_pass http://flyping_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}

# --- Mini App + same-origin API: app.flyping.ru ---

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.flyping.ru;

    ssl_certificate     /etc/letsencrypt/live/flyping.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flyping.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://telegram.org 'self';" always;

    location ~ /\.(git|env|ht) {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://flyping_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# --- API alias: api.flyping.ru (same upstream; Mini App uses app origin) ---

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.flyping.ru;

    ssl_certificate     /etc/letsencrypt/live/flyping.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flyping.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ~ /\.(git|env|ht) {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://flyping_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
