<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlyPing — сторож цены на авиабилеты</title>
  <meta name="description" content="FlyPing следит за ценой вашей поездки в Telegram и уведомляет, когда она не выше вашего порога." />
  <style>
    :root { color-scheme: light; --bg:#0b1f2a; --fg:#f4f7f5; --accent:#3ecf8e; --muted:#9bb0bc; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #16384a, var(--bg));
      color: var(--fg); display: flex; align-items: center; justify-content: center; padding: 2rem;
    }
    main { max-width: 34rem; }
    h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin: 0 0 .75rem; letter-spacing: -.02em; }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 1.25rem; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; }
    a.btn {
      display: inline-block; padding: .75rem 1.1rem; border-radius: .65rem;
      background: var(--accent); color: #062016; text-decoration: none; font-weight: 650;
    }
    a.secondary { background: transparent; color: var(--fg); border: 1px solid #355566; }
    small { display: block; margin-top: 1.5rem; color: #6f8794; }
  </style>
</head>
<body>
  <main>
    <h1>FlyPing — сторож цены</h1>
    <p>
      Задайте направление, даты и максимальную цену. FlyPing регулярно проверяет предложения
      в Telegram и пишет, когда цена не выше порога. Билеты не продаёт — покупка у партнёра.
    </p>
    <div class="actions">
      <a class="btn" id="bot" href="https://t.me/FlyPingAvia_Bot">Открыть в Telegram</a>
      <a class="btn secondary" href="https://app.flyping.ru/">Mini App</a>
    </div>
    <small>Production · flyping.ru</small>
  </main>
  <script>
    // Optional override via ?bot=Username without @
    (function () {
      var q = new URLSearchParams(location.search).get("bot");
      if (q && /^[A-Za-z][A-Za-z0-9_]{4,31}$/.test(q)) {
        document.getElementById("bot").href = "https://t.me/" + q;
      }
    })();
  </script>
</body>
</html>
