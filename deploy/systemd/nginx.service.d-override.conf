# OPS-01 nginx self-healing override (drop into /etc/systemd/system/nginx.service.d/override.conf)
# Do not edit vendor /lib/systemd/system/nginx.service directly.
#
# Install:
#   mkdir -p /etc/systemd/system/nginx.service.d
#   cp deploy/systemd/nginx.service.d-override.conf /etc/systemd/system/nginx.service.d/override.conf
#   systemctl daemon-reload && systemctl restart nginx

[Service]
Restart=on-failure
RestartSec=3s
