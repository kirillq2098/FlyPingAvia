# Production Compose for Timeweb VPS (IN-04 / OPS-01).
# Usage from /opt/flyping:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#   systemctl start flyping.service
#
# Architecture (v0.3.0):
#   flyping       — bot (polling) + FastAPI Mini App + checker + RL-03 (8080)
#   flyping-site  — marketing Next.js site for flyping.ru / www (3000)
# SQLite in named volume. PostgreSQL is NOT used.
#
# VPS baseline (OPS-01): ~4 GiB RAM, 2 CPU, no swap.
# Limits leave headroom for Docker daemon, nginx, OS, SSH, backups.

services:
  flyping:
    build:
      context: .
      args:
        APP_VERSION: "0.3.0"
    image: flypingavia:0.3.0
    container_name: flyping-app
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # Timeweb VPS: api.telegram.org reachable via IPv6 only from this host.
    # Bridge networking without IPv6 breaks polling; host network inherits IPv6.
    network_mode: host
    env_file:
      - .env
    volumes:
      - flyping-data:/app/data
      - /var/log/flyping:/app/logs
    environment:
      APP_ENV: production
      WEBAPP_HOST: "127.0.0.1"
      WEBAPP_PORT: "8080"
      WEBAPP_DEV_USER_ID: "0"
      FORWARDED_ALLOW_IPS: "127.0.0.1"
      DB_PATH: /app/data/flypingavia.db
      MINIAPP_DIAG_LOG_PATH: /app/logs/miniapp-diagnostic.log
    # Standalone Compose (non-swarm): mem_limit / cpus are applied.
    mem_limit: 2500m
    cpus: 1.6
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  flyping-site:
    build:
      context: ./website
      args:
        NEXT_PUBLIC_SITE_URL: "https://flyping.ru"
        NEXT_PUBLIC_TELEGRAM_BOT_URL: "https://t.me/FlyPingAvia_Bot"
        NEXT_PUBLIC_TELEGRAM_USERNAME: "FlyPingAvia_Bot"
        NEXT_PUBLIC_SUPPORT_EMAIL: "support@flyping.ru"
        NEXT_PUBLIC_GA_ID: ""
        NEXT_PUBLIC_YANDEX_METRICA_ID: ""
    image: flyping-site:0.3.0
    container_name: flyping-site
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "127.0.0.1"
    mem_limit: 900m
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  flyping-data:
    name: flyping-data
